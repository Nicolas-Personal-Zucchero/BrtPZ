[build-system]
requires = ["setuptools", "setuptools-scm", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brt_pz"
version = "0.1.0"
description = "Python client library for BRT (Bartolini) REST APIs"
authors = [
  { name = "Nicolas Amadori", email = "nicolas.amadori02@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "requests>=2.28.0",
]

[tool.setuptools.package-data]
brt_pz = ["py.typed", "*.pyi"]
